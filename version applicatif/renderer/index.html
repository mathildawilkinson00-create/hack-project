<!doctype html>
<!--
  renderer/index.html — WHAT is on the app window (buttons, video, sliders...).
  panel.css = how it LOOKS, panel.js = what HAPPENS when you click.
  Elements with an id="..." are used by panel.js through $("id").
  This window is created by main.js (the desktop app).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Point Right</title>
  <!-- Security: only run our own scripts (+ WebAssembly for MediaPipe). Same idea as the extension's manifest. -->
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'wasm-unsafe-eval'; object-src 'none'">
  <link rel="stylesheet" href="panel.css"> <!-- load the look -->
</head>
<body>
  <!-- Title + "🟢 Listening / ⚪ Paused" status -->
  <header>
    <h1>Point Right</h1>
    <span id="status" class="status off">⚪ Paused</span>
  </header>

  <!-- Camera: the video, a transparent canvas on top for the hand skeleton,
       and the "toast" bubble that shows "➡️ Next slide!" -->
  <div class="camera">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="toast" class="toast"></div>
  </div>

  <button id="startBtn" class="big">▶ Start camera</button>

  <!-- Gesture list: the rows are created by showGestureList() in panel.js -->
  <section>
    <h2>Gestures</h2>
    <div id="gestureList"></div>
    <div id="addGesture" class="add-gesture">
      <select id="addSelect" aria-label="Gesture to add"></select>
      <button id="addBtn">+ Add gesture</button>
    </div>
  </section>

  <section>
    <h2>Display</h2>
    <label><input id="tracking" type="checkbox"> Show hand tracking</label>
  </section>

  <!-- Sliders for the engine's anti-accident rules -->
  <section>
    <h2>Sensitivity</h2>
    <label>Hold time <span id="holdVal"></span>
      <input id="hold" type="range" min="2" max="30">
    </label>
    <label>Cooldown <span id="coolVal"></span>
      <input id="cool" type="range" min="200" max="3000" step="100">
    </label>
    <p class="hint">
      <b>Hold time:</b> how long you hold a gesture before it triggers. Higher = fewer accidents, but slower.<br>
      <b>Cooldown:</b> the pause after each action. Higher = no double-skips, but you wait longer between slides.
    </p>
  </section>

  <!-- Buttons to test the Figma connection without the camera.
       Hidden from users; kept for debugging. Remove "hidden" to show it again. -->
  <section id="bridgeTest" hidden>
    <h2>Test the Figma bridge</h2>
    <button id="testPrev">◀ Test prev</button>
    <button id="testNext">Test next ▶</button>
  </section>

  <!-- Load the behaviour last, once all the elements above exist.
       type="module" lets panel.js use "import" to load the engine. -->
  <script type="module" src="panel.js"></script>
</body>
</html>
